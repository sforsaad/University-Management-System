<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniPortal — University Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo">U</div>
      <div class="brand-text">
        <span class="brand-name">UniPortal</span>
        <span class="brand-tagline">Management System</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')">
        <span class="nav-icon">◈</span><span>Dashboard</span>
      </a>
      <a class="nav-item" data-page="students" onclick="navigate('students')">
        <span class="nav-icon">◉</span><span>Students</span>
      </a>
      <a class="nav-item" data-page="courses" onclick="navigate('courses')">
        <span class="nav-icon">◫</span><span>Courses</span>
      </a>
      <a class="nav-item" data-page="enrollments" onclick="navigate('enrollments')">
        <span class="nav-icon">◎</span><span>Enrollments</span>
      </a>
      <a class="nav-item" data-page="faculty" onclick="navigate('faculty')">
        <span class="nav-icon">◐</span><span>Faculty</span>
      </a>
      <a class="nav-item" data-page="departments" onclick="navigate('departments')">
        <span class="nav-icon">▣</span><span>Departments</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <span class="db-status" id="dbStatus">● Connected</span>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <header class="topbar">
      <div class="topbar-title" id="pageTitle">Dashboard</div>
      <div class="topbar-actions" id="topbarActions"></div>
    </header>

    <div class="page-content" id="pageContent">
      <!-- Pages load here -->
    </div>
  </main>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Modal</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast-container" id="toastContainer"></div>

<script src="js/api.js"></script>
<script src="js/components.js"></script>
<script src="js/pages/dashboard.js"></script>
<script src="js/pages/students.js"></script>
<script src="js/pages/courses.js"></script>
<script src="js/pages/enrollments.js"></script>
<script src="js/pages/faculty.js"></script>
<script src="js/pages/departments.js"></script>
<script src="js/app.js"></script>
</body>
</html>
